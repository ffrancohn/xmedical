{% load static %}
{% if estado_icon %}
<span class="xm-cita-estado-badge badge badge-outline gap-1">
    <img src="{% static estado_icon %}" alt="" width="18" height="18" class="xm-cita-estado-badge__icon" loading="lazy">
    {{ label }}
</span>
{% else %}
<span class="badge badge-outline">{{ label }}</span>
{% endif %}
