{% load static %}
<section class="xm-atlas-hub mb-6" data-atlas-hub data-atlas-initial-module="citas">
    {% include 'atlas/hub_nav_recepcionista.html' %}
    <div class="xm-atlas-hub__scene xm-atlas-hub__scene--agenda">
        <div class="xm-atlas-hub__objects">
            <button type="button" class="xm-atlas-object is-active" data-atlas-module="citas" aria-expanded="true"
                data-atlas-img-closed="{% static 'atlas-interactive/assets/v1/modulos/citas_agenda_cerrada.webp' %}"
                data-atlas-img-open="{% static 'atlas-interactive/assets/v1/modulos/citas_agenda_abierta.webp' %}">
                <span class="xm-atlas-object__visual xm-atlas-object__visual--agenda">
                    <img src="{% static 'atlas-interactive/assets/v1/modulos/citas_agenda_abierta.webp' %}" alt="" width="120" height="120" loading="lazy" class="xm-atlas-object__img">
                </span>
                <span class="xm-atlas-object__label">Agenda</span>
                <span class="xm-atlas-object__desc">Programación y reservas</span>
            </button>
        </div>
    </div>
    <div id="xm-atlas-explore" class="xm-atlas-explore">
        <div class="xm-atlas-explore__panel" data-atlas-panel="citas">
            {% include 'atlas/explore_citas.html' with explore=citas_explore %}
        </div>
    </div>
</section>
