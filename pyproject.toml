[project]
name = "xmedical"
version = "0.1.0"
description = "Sistema de gestión clínica multi-tenant"
requires-python = ">=3.11"
dependencies = [
    "Django==4.2.30",
    "psycopg2-binary==2.9.9",
    "django-environ==0.11.2",
    "django-cors-headers==4.3.1",
    "whitenoise==6.6.0",
    "gunicorn==23.0.0",
    "celery==5.3.4",
    "redis==5.0.1",
    "django-celery-beat==2.9.0",
    "reportlab==4.2.5",
    "python-decouple==3.8",
    "Pillow==12.2.0",
    "pytest==9.0.3",
    "pytest-django==4.9.0",
    "segno==1.6.1",
    "qrcode==7.4.2",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.4.0",
    "drf-spectacular==0.28.0",
]

[dependency-groups]
dev = [
    "coverage>=7.4.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "locust>=2.20.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.uv]
package = false
