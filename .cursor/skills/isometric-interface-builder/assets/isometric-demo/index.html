<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Áreas isométricas</title><style>body{margin:0;font-family:system-ui;background:#f4f8fb;color:#18324b}main{max-width:1000px;margin:auto;padding:2rem}h1{font-size:clamp(1.5rem,4vw,2.5rem)}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:1.2rem}.scene,.panel{background:white;border:1px solid #d5e1eb;border-radius:1rem;padding:1rem}.scene svg{width:100%;height:auto}.area{cursor:pointer;outline:none}.area polygon{stroke:#29516c;stroke-width:2}.area:focus-visible polygon,.area.selected polygon{stroke:#ed8b2c;stroke-width:5}.panel button{width:100%;margin:.25rem 0;border:1px solid #a5bdd0;background:white;padding:.7rem;border-radius:.5rem;text-align:left;cursor:pointer}.panel button[aria-pressed=true]{background:#e3f1fc;border-color:#26709b}.panel button:focus-visible{outline:3px solid #e79f43}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style></head><body><main><h1>Áreas de una clínica</h1><p>Seleccione un área en el plano o en la lista para ver su información.</p><div class="layout"><div class="scene"><svg viewBox="0 0 640 430" role="group" aria-label="Plano isométrico de tres áreas"><path d="M80 210L300 90 570 220 350 340Z" fill="#d8e8f1" stroke="#6e93ae" stroke-width="3"/><g class="area" tabindex="0" role="button" aria-label="Recepción" data-id="recepcion"><polygon points="100,210 220,145 320,195 200,265" fill="#86bcd5"/><polygon points="100,210 200,265 200,315 100,260" fill="#669eb8"/><polygon points="200,265 320,195 320,245 200,315" fill="#477f9b"/><text x="180" y="207" text-anchor="middle" fill="#142f44" font-size="16">Recepción</text></g><g class="area" tabindex="0" role="button" aria-label="Consultorios" data-id="consultorios"><polygon points="240,138 345,80 460,140 355,198" fill="#94c9aa"/><polygon points="240,138 355,198 355,248 240,188" fill="#66a482"/><polygon points="355,198 460,140 460,190 355,248" fill="#498c68"/><text x="350" y="146" text-anchor="middle" fill="#153b2d" font-size="16">Consultorios</text></g><g class="area" tabindex="0" role="button" aria-label="Laboratorio" data-id="laboratorio"><polygon points="330,256 447,192 549,245 432,309" fill="#e9c68c"/><polygon points="330,256 432,309 432,356 330,303" fill="#d2a76e"/><polygon points="432,309 549,245 549,292 432,356" fill="#bd8952"/><text x="440" y="261" text-anchor="middle" fill="#55350b" font-size="16">Laboratorio</text></g></svg></div><aside class="panel"><h2>Seleccionar área</h2><div id="areas"></div><h3 id="name"></h3><p id="info" aria-live="polite"></p></aside></div></main><script>const entities=[{id:'recepcion',name:'Recepción',info:'Registro y orientación inicial de pacientes.'},{id:'consultorios',name:'Consultorios',info:'Atención médica y evaluación clínica.'},{id:'laboratorio',name:'Laboratorio',info:'Toma y procesamiento de muestras.'}];const list=document.querySelector('#areas');function select(id){const item=entities.find(x=>x.id===id);if(!item)return;document.querySelectorAll('.area').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));document.querySelectorAll('[data-button-id]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.buttonId===id)));document.querySelector('#name').textContent=item.name;document.querySelector('#info').textContent=item.info;}entities.forEach(item=>{const btn=document.createElement('button');btn.textContent=item.name;btn.dataset.buttonId=item.id;btn.setAttribute('aria-pressed','false');btn.addEventListener('click',()=>select(item.id));list.append(btn);});document.querySelectorAll('.area').forEach(el=>{el.addEventListener('click',()=>select(el.dataset.id));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(el.dataset.id);}});});select('recepcion');</script></body></html>
